[package]
name = "bytecut-ssimulacra2"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rayon is off: a worker pool in JS does the parallelism, and WASM threads need
# cross-origin-isolation-style setup that Node does not need to be asked for.
ssimulacra2 = { version = "=0.5.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
